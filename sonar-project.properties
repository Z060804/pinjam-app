public/vendor/**,\
public/stisla/**,\
public/assets/**,\
node_modules/**,\
resources/**,\
tests/**,\
_bmad/**,\
.agent/**,\
.claude/**,\
.gemini/**,\
.kiro/**,\
.opencode/**,\
.qodo/**,\
.trae/**,\
.vscode/**

# PHP SETTINGS
sonar.php.file.suffixes=php
